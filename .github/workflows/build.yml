name: Build Silent Client

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mod:
    name: Build mod (Legacy Fabric 1.8.9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        working-directory: mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: silentclient-mod
          path: |
            mod/build/libs/silentclient-*.jar
            !mod/build/libs/*-sources.jar

  launcher:
    name: Build launcher (.exe)
    needs: mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: silentclient-mod
          path: launcher/resources/mods
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build installer
        working-directory: launcher
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm install
          npm run dist -- --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SilentClient-Setup
          path: launcher/dist/*.exe
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Silent Client (build ${{ github.run_number }})
          body: Κατέβασε το SilentClient-Setup .exe από τα Assets παρακάτω.
          files: launcher/dist/*.exe
