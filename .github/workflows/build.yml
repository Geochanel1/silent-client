name: Build Silent Client

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mod:
    name: Build mod (Legacy Fabric 1.8.9)
    runs-on: ubuntu-latest
    # Αν πέσει ο server της Legacy Fabric, ο launcher φτιάχνεται κανονικά
    # και κατεβάζει το mod μόνος του αργότερα.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        working-directory: mod
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew build --no-daemon 2>&1 | tee build.log; then
            msg=$(grep -E -A3 "error:|What went wrong|Could not|FAILURE|Exception|> " build.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::${msg}"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: silentclient-mod
          path: |
            mod/build/libs/silentclient-*.jar
            !mod/build/libs/*-sources.jar

  launcher:
    name: Build launcher (.exe)
    needs: mod
    if: always()
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Get mod (if it was built)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: silentclient-mod
          path: mod-jar
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Build installer
        working-directory: launcher
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm install
          npm run dist -- --win --publish never
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Silent Client (build ${{ github.run_number }})
          body: Κατέβασε το SilentClient-Setup .exe από τα Assets παρακάτω.
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            launcher/dist/*.exe
            mod-jar/silentclient-*.jar
