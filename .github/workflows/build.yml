name: Build Silent Client

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mod:
    name: Build mod (Legacy Fabric 1.8.9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Probe plugin versions
        shell: bash
        run: |
          out=""
          for u in https://maven.legacyfabric.net/legacy-looming/legacy-looming.gradle.plugin/maven-metadata.xml \
                   https://maven.legacyfabric.net/net/legacyfabric/legacy-looming/maven-metadata.xml \
                   https://maven.fabricmc.net/net/fabricmc/fabric-loom-remap/maven-metadata.xml \
                   https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml; do
            code=$(curl -s -o m.xml -w '%{http_code}' "$u")
            v=$(grep -o '<version>[^<]*</version>' m.xml 2>/dev/null | sed 's/<[^>]*>//g' | tail -12 | tr '\n' ' ')
            out="$out$u -> $code : $v%0A"
          done
          echo "::notice title=Plugin versions::$out"
      - name: Build
        working-directory: mod
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew build --no-daemon 2>&1 | tee build.log; then
            # στέλνει τα σημαντικά κομμάτια του λάθους ως annotation (φαίνεται στη σελίδα του build)
            msg=$(grep -E -A3 "error:|What went wrong|Could not|FAILURE|Exception|> " build.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::${msg}"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: silentclient-mod
          path: |
            mod/build/libs/silentclient-*.jar
            !mod/build/libs/*-sources.jar

  launcher:
    name: Build launcher (.exe)
    needs: mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: silentclient-mod
          path: launcher/resources/mods
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Build installer
        working-directory: launcher
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm install
          npm run dist -- --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SilentClient-Setup
          path: launcher/dist/*.exe
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Silent Client (build ${{ github.run_number }})
          body: Κατέβασε το SilentClient-Setup .exe από τα Assets παρακάτω.
          files: launcher/dist/*.exe
